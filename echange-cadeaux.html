<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .maintenance-container {
            text-align: center;
            max-width: 500px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 40px;
            position: relative;
        }

        .loader::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #f0f0f0;
            border-top-color: #25D366;
            animation: spin 1s linear infinite;
        }

        .loader::after {
            content: '⚙️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            animation: rotate 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .highlight {
            color: #25D366;
            font-weight: 600;
        }

        .dots {
            display: inline-block;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        .icon-container {
            margin-top: 30px;
            font-size: 48px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="loader"></div>
        
        <h1>En cours de maintenance</h1>
        
        <p>Notre site est actuellement en cours de maintenance.</p>
        <p class="highlight">Il sera bientôt disponible<span class="dots">...</span></p>
        
        <div class="icon-container">
            🔧 🛠️
        </div>
    </div>

    <script>
        // Animation des points
        setInterval(() => {
            const dotsElement = document.querySelector('.dots');
            const currentDots = dotsElement.textContent;
            if (currentDots.length >= 3) {
                dotsElement.textContent = '';
            } else {
                dotsElement.textContent += '.';
            }
        }, 500);
    </script>
</body>
</html>
