<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des Retraits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --accent-blue: #00d9ff;
            --accent-purple: #b537f2;
            --success: #00ff9f;
            --warning: #ffd60a;
            --error: #ff006e;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a6e;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background - DÉSACTIVÉ pour fond blanc pur */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 0;
        }

        /* Grid overlay - DÉSACTIVÉ */
        body::after {
            display: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            animation: slideInDown 0.6s ease;
        }

        .back-arrow {
            width: 50px;
            height: 50px;
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
        }

        .back-arrow:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--accent-blue);
            transform: translateX(-5px);
        }

        .header-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        /* History Container */
        #history-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 24px;
            animation: fadeInUp 0.8s ease 0.2s backwards;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardAppear 0.6s ease backwards;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.05), rgba(181, 55, 242, 0.05));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 217, 255, 0.4);
            box-shadow: 0 20px 60px rgba(0, 217, 255, 0.15);
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }

        /* Operator Logo Section - REMOVED */

        /* Card Content */
        .card-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
        }

        .value.red {
            color: var(--error);
        }

        .value.green {
            color: var(--success);
        }

        /* Badges */
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: rgba(0, 255, 159, 0.15);
            color: var(--success);
            border: 1px solid rgba(0, 255, 159, 0.3);
        }

        .badge-pending {
            background: rgba(255, 214, 10, 0.15);
            color: var(--warning);
            border: 1px solid rgba(255, 214, 10, 0.3);
        }

        .badge-failed {
            background: rgba(255, 0, 110, 0.15);
            color: var(--error);
            border: 1px solid rgba(255, 0, 110, 0.3);
        }

        /* No History */
        .no-history {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Animations */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 2rem;
            }

            #history-container {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--accent-purple), var(--accent-blue));
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-arrow">←</div>
            <h1 class="header-title">Historique des Retraits</h1>
        </div>

        <div id="history-container">
            <div class="no-history">Chargement de l'historique...</div>
        </div>
    </div>

    <script type="module">
    /* ===============================
       🔹 IMPORTS FIREBASE
    =============================== */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

    import {
        getStorage
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-storage.js";


    /* ===============================
       🔹 CONFIGURATION FIREBASE
    =============================== */
    const firebaseConfig = {
        apiKey: "AIzaSyC9s9vqmB5sAxZ8m4vJf6u8LrbstJZKskI",
        authDomain: "ytc-t-19beb.firebaseapp.com",
        databaseURL: "https://ytc-t-19beb-default-rtdb.firebaseio.com",
        projectId: "ytc-t-19beb",
        storageBucket: "ytc-t-19beb.firebasestorage.app",
        messagingSenderId: "1008752984173",
        appId: "1:1008752984173:web:559ca1cd4afc2a9ae57f64"
    };

    // --- Init Firebase ---
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // --- Utils ---
    function formatCurrency(amount) {
        return Math.round(amount).toLocaleString() + ' FCFA';
    }

    function formatDate(ts) {
        if(!ts) return "Date inconnue";
        const time = Number(ts);
        const date = new Date(time);
        return date.toLocaleString('fr-FR', {
            day:'2-digit',
            month:'2-digit',
            year:'numeric',
            hour:'2-digit',
            minute:'2-digit'
        });
    }

    function statusBadge(status) {
        const s = (status || '').toLowerCase();
        if(s === 'success' || s === 'payé' || s === 'succès' || s === 'terminé')
            return `<span class="badge badge-success">${status}</span>`;
        if(s === 'pending' || s === 'en attente' || s === 'traitement bancaire')
            return `<span class="badge badge-pending">${status}</span>`;
        return `<span class="badge badge-failed">${status}</span>`;
    }

    function createWithdrawalCard(w) {
        const amt = formatCurrency(w.amount || 0);
        const fees = formatCurrency(w.fees || 0);
        const net = formatCurrency((w.amount || 0) - (w.fees || 0));
        const dateStr = formatDate(w.timestamp || w.date || w.order || Date.now());

        return `
        <div class="card">
            <div class="card-content">
                <div class="row"><span class="label">Montant retiré :</span><span class="value red">− ${amt}</span></div>
                <div class="row"><span class="label">Frais d'opération :</span><span class="value red">− ${fees}</span></div>
                <div class="row"><span class="label">Montant à recevoir :</span><span class="value green">${net}</span></div>
                <div class="row"><span class="label">Statut :</span><span class="value">${statusBadge(w.status)}</span></div>
                <div class="row"><span class="label">Date de retrait :</span><span class="value">${dateStr}</span></div>
            </div>
        </div>`;
    }

    // --- Display history ---
    function displayWithdrawalHistory(history){
        const container = document.getElementById('history-container');
        if(!history || Object.keys(history).length === 0){
            container.innerHTML = '<div class="no-history">Aucun retrait disponible</div>';
            return;
        }
        container.innerHTML = '';

        Object.entries(history)
            .sort(([, a], [, b]) => {
                const aTime = a.timestamp 
                    ? Number(a.timestamp)
                    : (a.date ? Number(a.date)
                    : (a.order ? Number(a.order) : 0));

                const bTime = b.timestamp 
                    ? Number(b.timestamp)
                    : (b.date ? Number(b.date)
                    : (b.order ? Number(b.order) : 0));

                return bTime - aTime;
            })
            .forEach(([, w]) => {
                container.innerHTML += createWithdrawalCard(w);
            });
    }

    // --- Auth ---
    onAuthStateChanged(auth, user => {
        if(user){
            const historyRef = ref(db, `users/${user.uid}/withdrawalHistory`);
            onValue(historyRef, snapshot => {
                displayWithdrawalHistory(snapshot.val());
            });
        } else {
            window.location.href = 'login.html';
        }
    });

    // --- Back button ---
    document.querySelector('.back-arrow')?.addEventListener('click', () => history.back());
    </script>
</body>
</html>
