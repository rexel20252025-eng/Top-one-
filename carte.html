<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informations du Compte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --accent-blue: #00d9ff;
            --accent-purple: #b537f2;
            --success: #00ff9f;
            --warning: #ffd60a;
            --error: #ff006e;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a6e;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            animation: slideInDown 0.6s ease;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .back-button:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--accent-blue);
            transform: translateX(-5px);
        }

        .header-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border-color);
            margin-bottom: 24px;
            animation: cardAppear 0.8s ease 0.2s backwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Operator Badge */
        .operator-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: 0 8px 24px rgba(0, 217, 255, 0.3);
        }

        .operator-badge-icon {
            font-size: 2rem;
        }

        .operator-badge-text {
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        /* Info Section */
        .info-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .info-row:hover {
            background: rgba(0, 217, 255, 0.05);
            transform: translateX(5px);
        }

        .info-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .info-value.loading {
            background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            height: 24px;
            width: 150px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Link Date */
        .link-date {
            text-align: center;
            padding: 16px;
            background: rgba(0, 255, 159, 0.1);
            border: 2px solid rgba(0, 255, 159, 0.3);
            border-radius: 16px;
            color: var(--success);
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 255, 159, 0.1);
            border: 2px solid rgba(0, 255, 159, 0.3);
            border-radius: 12px;
            color: var(--success);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        /* Message */
        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-success {
            background: rgba(0, 255, 159, 0.1);
            color: var(--success);
            border: 2px solid rgba(0, 255, 159, 0.3);
        }

        .message-error {
            background: rgba(255, 0, 110, 0.1);
            color: var(--error);
            border: 2px solid rgba(255, 0, 110, 0.3);
        }

        /* Security Note */
        .security-note {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 20px;
            background: rgba(255, 214, 10, 0.05);
            border: 2px solid rgba(255, 214, 10, 0.2);
            border-radius: 16px;
            margin-top: 24px;
        }

        .security-icon {
            font-size: 1.5rem;
            margin-top: 2px;
        }

        .security-text {
            flex: 1;
        }

        .security-title {
            font-weight: 600;
            color: var(--warning);
            margin-bottom: 4px;
        }

        .security-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 0;
            }

            .header-title {
                font-size: 1.5rem;
            }

            .card {
                padding: 28px 20px;
            }

            .operator-badge {
                padding: 12px 20px;
            }

            .operator-badge-text {
                font-size: 1.2rem;
            }

            .info-row {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="backButton" class="back-button">←</button>
            <h1 class="header-title">Mon Compte</h1>
        </div>

        <div id="message" class="message"></div>

        <div class="card">
            <!-- Operator Badge -->
            <div class="operator-badge">
                <span class="operator-badge-icon">📱</span>
                <span class="operator-badge-text" id="operatorDisplay">Chargement...</span>
            </div>

            <!-- Account Status -->
            <div style="margin-bottom: 32px;">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span>Compte actif</span>
                </div>
            </div>

            <!-- Account Information -->
            <div class="info-section">
                <div class="section-title">Informations du compte</div>
                
                <div class="info-row">
                    <div class="info-icon">🏢</div>
                    <div class="info-content">
                        <div class="info-label">Opérateur</div>
                        <div id="operatorInfo" class="info-value loading">MTN</div>
                    </div>
                </div>

                <div class="info-row">
                    <div class="info-icon">📞</div>
                    <div class="info-content">
                        <div class="info-label">Numéro de téléphone</div>
                        <div id="phoneInfo" class="info-value loading">+243 XX XXX XXXX</div>
                    </div>
                </div>
            </div>

            <!-- Link Date -->
            <div id="linkDate" class="link-date loading">
                🔗 Compte lié le --/--/----
            </div>

            <!-- Security Note -->
            <div class="security-note">
                <div class="security-icon">🔒</div>
                <div class="security-text">
                    <div class="security-title">Sécurité</div>
                    <div class="security-description">
                        Vos informations sont cryptées et sécurisées. Ne partagez jamais vos identifiants avec qui que ce soit.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
    // --- Import Firebase ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { 
        getAuth, 
        onAuthStateChanged, 
        createUserWithEmailAndPassword, 
        signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-storage.js";

    // --- Configuration Firebase (YTC) ---
    const firebaseConfig = {
        apiKey: "AIzaSyC9s9vqmB5sAxZ8m4vJf6u8LrbstJZKskI",
        authDomain: "ytc-t-19beb.firebaseapp.com",
        databaseURL: "https://ytc-t-19beb-default-rtdb.firebaseio.com",
        projectId: "ytc-t-19beb",
        storageBucket: "ytc-t-19beb.firebasestorage.app",
        messagingSenderId: "1008752984173",
        appId: "1:1008752984173:web:559ca1cd4afc2a9ae57f64"
    };

    // --- Initialisation ---
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // --- Fonctions utilitaires ---
    const formatPhoneNumber = phone => phone.replace(/(\d{2})(?=\d)/g, "$1 ");
    const formatDate = timestamp => {
        const date = new Date(timestamp);
        return date.toLocaleDateString('fr-FR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });
    };

    // --- Gestion des messages ---
    const showMessage = (text, type) => {
        const messageDiv = document.getElementById('message');
        if (!messageDiv) return;

        messageDiv.className = `message message-${type}`;
        messageDiv.textContent = text;
        messageDiv.style.display = 'block';

        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    };

    // --- Affichage des informations du compte ---
    const displayAccountInfo = async (user) => {
        try {
            const snapshot = await get(ref(db, `users/${user.uid}/withdrawalConfig`));
            const data = snapshot.val();

            if (data) {
                document.getElementById('operatorDisplay').textContent = data.operator;
                document.getElementById('operatorInfo').textContent = data.operator;
                document.getElementById('phoneInfo').textContent = formatPhoneNumber(data.phone);
                document.getElementById('linkDate').textContent =
                    `🔗 Compte lié le ${formatDate(data.configuredAt)}`;

                document.querySelectorAll('.loading')
                    .forEach(el => el.classList.remove('loading'));
            } else {
                showMessage('Aucun compte lié trouvé', 'error');
            }
        } catch (error) {
            console.error('Erreur lors du chargement des données:', error);
            showMessage(`Erreur: ${error.message}`, 'error');
        }
    };

    // --- Bouton retour ---
    document.getElementById('backButton')?.addEventListener('click', () => {
        window.history.back();
    });

    // --- Vérification de l'authentification ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            displayAccountInfo(user);
        } else {
            window.location.href = 'retrait.html';
        }
    });
</script>
</body>
</html>
