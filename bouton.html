<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'Accueil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Navigation en bas */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .nav-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 15px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-button:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .nav-button.active {
            background: rgba(255,255,255,0.2);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .nav-label {
            font-size: 0.75em;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Contenu de la page ici -->
    </div>

    <!-- Barre de navigation en bas -->
    <nav class="bottom-nav">
        <div class="nav-container">
            <button class="nav-button active" onclick="navigateTo('accueil')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Accueil</span>
            </button>

            <button class="nav-button" onclick="navigateTo('investir')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <span class="nav-label">Investir</span>
            </button>

            <button class="nav-button" onclick="navigateTo('vip')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
                </svg>
                <span class="nav-label">VIP</span>
            </button>

            <button class="nav-button" onclick="navigateTo('compte')">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="nav-label">Compte</span>
            </button>
        </div>
    </nav>

    <script>
        function navigateTo(page) {
            // Retirer la classe active de tous les boutons
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Ajouter la classe active au bouton cliqué
            event.currentTarget.classList.add('active');
            
            // Ici vous pouvez ajouter la logique de navigation
            console.log('Navigation vers:', page);
            
            // Exemple: alert pour montrer que ça fonctionne
            if (page !== 'accueil') {
                alert(`Navigation vers la page: ${page.charAt(0).toUpperCase() + page.slice(1)}`);
            }
        }
    </script>
</body>
</html>
