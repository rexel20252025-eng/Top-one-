<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page d'Accueil - YTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            padding-bottom: 80px;
            padding-top: 140px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Bannière en haut */
        .top-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.85) 0%, rgba(118, 75, 162, 0.85) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            z-index: 999;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .banner-text {
            color: white;
            font-size: 1.3em;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            margin: 0;
            animation: fadeIn 1s ease-in, float 3s ease-in-out infinite;
            background: linear-gradient(90deg, #fff, #ffd700, #fff, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s ease-in, gradientMove 3s ease infinite, float 4s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% center;
            }
            50% {
                background-position: 100% center;
            }
            100% {
                background-position: 0% center;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .banner-company {
            color: #ffd700;
            font-weight: 800;
            font-size: 1.15em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulseGlow 2s ease-in-out infinite, gradientMove 3s ease infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                filter: brightness(1);
                transform: scale(1);
            }
            50% {
                filter: brightness(1.3);
                transform: scale(1.05);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Boutons sous la bannière */
        .banner-buttons {
            position: fixed;
            top: 95px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background: white;
            z-index: 998;
        }

        .banner-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(102, 126, 234, 0.1);
            border: 1.5px solid rgba(102, 126, 234, 0.3);
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(102, 126, 234, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-decoration: none;
        }

        .banner-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(102, 126, 234, 0.2);
        }

        .banner-btn:active {
            transform: translateY(-1px);
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            stroke: #667eea;
            stroke-width: 2.5;
            fill: none;
        }

        /* Section des transactions */
        .transactions-section {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .transactions-title {
            font-size: 1.5em;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .transaction-card {
            background: white;
            border-radius: 20px;
            padding: 18px 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            animation: slideIn 0.5s ease-out;
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .transaction-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
        }

        .transaction-card.recharge {
            border-color: rgba(76, 175, 80, 0.3);
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .transaction-card.retrait {
            border-color: rgba(244, 67, 54, 0.3);
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .transaction-card.commission {
            border-color: rgba(255, 193, 7, 0.3);
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.05) 0%, rgba(255, 255, 255, 1) 100%);
        }

        .transaction-icon {
            font-size: 1.8em;
            min-width: 45px;
            text-align: center;
            flex-shrink: 0;
        }

        .transaction-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .transaction-number {
            font-weight: 700;
            font-size: 0.9em;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transaction-action {
            font-size: 0.8em;
            color: #666;
        }

        .transaction-amount {
            font-weight: 800;
            font-size: 1em;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
            min-width: 90px;
        }

        .transaction-amount.positive {
            color: #4caf50;
        }

        .transaction-amount.negative {
            color: #f44336;
        }

        .transaction-amount.commission-color {
            color: #ff9800;
        }

        /* Bouton Échange de cadeaux */
        .gift-button-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .gift-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15) 0%, rgba(255, 152, 0, 0.15) 100%);
            border: 2px solid rgba(255, 193, 7, 0.4);
            color: #ff9800;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 193, 7, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .gift-btn:hover {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.25) 0%, rgba(255, 152, 0, 0.25) 100%);
            border-color: rgba(255, 193, 7, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 193, 7, 0.35);
        }

        .gift-btn:active {
            transform: translateY(-1px);
        }

        .gift-icon {
            width: 24px;
            height: 24px;
            stroke: #ff9800;
            stroke-width: 2.5;
            fill: none;
        }

        /* Navigation en bas */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .nav-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 15px;
        }

        .nav-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-button:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .nav-button.active {
            background: rgba(255,255,255,0.2);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .nav-label {
            font-size: 0.75em;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
    </style>
</head>

            },
            {
                type: 'commission',

                country: '🇧🇯',
                number: '+229 096543xxxx',
                action: 'a reçu une commission de',

                amountClass: 'commission-color'
            },
            {
                type: 'recharge',

                country: '🇨🇮',
                number: '+225 070514xxxx',

                amount: '15.000 FCFA',

            },
            {
                type: 'retrait',
                icon: '📤',
                country: '🇸🇳',
                number: '+221 078912xxxx',
                action: 'a retiré',
                amount: '5.200 FCFA',

            },
            {
                type: 'commission',
                icon: '💰',

                action: 'a reçu une commission de',
                amount: '+500 FCFA',
                amountClass: 'commission-color'
            },
            {
                type: 'recharge',
                icon: '📥',
                country: '🇧🇫',
                number: '+226 071298xxxx',
                action: 'a rechargé',
                amount: '35.000 FCFA',
                amountClass: 'positive'
            },
            {
                type: 'retrait',
                icon: '📤',
                country: '🇲🇱',
                number: '+223 065789xxxx',
                action: 'a retiré',
                amount: '12.500 FCFA',
                amountClass: 'negative'
            },
            {
                type: 'commission',
                icon: '💰',
                country: '🇹🇬',
                number: '+228 087654xxxx',
                action: 'a reçu une commission de',
                amount: '+950 FCFA',
                amountClass: 'commission-color'
            }
        ];

        let currentIndex = 0;

        function updateTransactions() {
            const container = document.getElementById('transactions-container');
            const transactionsHTML = [];
            
            // Afficher 2 transactions à la fois
            for (let i = 0; i < 2; i++) {
                const index = (currentIndex + i) % transactions.length;
                const trans = transactions[index];
                
                transactionsHTML.push(`
                    <div class="transaction-card ${trans.type}">
                        <div class="transaction-icon">${trans.icon}</div>
                        <div class="transaction-info">
                            <div class="transaction-number">${trans.country} ${trans.number}</div>
                            <div class="transaction-action">${trans.action}</div>
                        </div>
                        <div class="transaction-amount ${trans.amountClass}">${trans.amount}</div>
                    </div>
                `);
            }
            
            // Mettre à jour le HTML
            container.innerHTML = transactionsHTML.join('');
            
            // Passer aux 2 transactions suivantes
            currentIndex = (currentIndex + 2) % transactions.length;
        }

        // Afficher les premières transactions au chargement
        updateTransactions();

        // Démarrer la rotation automatique toutes les 4 secondes
        setInterval(updateTransactions, 4000);

        function navigateTo(page) {
            // Retirer la classe active de tous les boutons
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Ajouter la classe active au bouton cliqué
            event.currentTarget.classList.add('active');
            
            // Ici vous pouvez ajouter la logique de navigation
            console.log('Navigation vers:', page);
            
            // Exemple: alert pour montrer que ça fonctionne
            if (page !== 'accueil') {
                alert(`Navigation vers la page: ${page.charAt(0).toUpperCase() + page.slice(1)}`);
            }
        }
    </script>
